<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon espace — Coder avec l'IA</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="entete">
    <div class="conteneur">
      <a class="logo" href="index.html"><span>&lt;/&gt;</span>Code09</a>
      <nav class="nav" aria-label="Compte">
        <a id="lien-admin" class="cache" href="admin.html">Admin</a>
        <a href="#" id="deconnexion">Se déconnecter</a>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <div class="conteneur">
        <h1 style="font-size: clamp(2rem, 5vw, 3rem);" id="titre">Mon espace</h1>
        <p class="intro" id="bonjour"></p>

        <div id="bloc-progression" class="cache" style="max-width: 560px;">
          <div class="progression" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="barre"><div></div></div>
          <p class="mention" id="texte-progression"></p>
          <div class="actions" style="margin-top: 12px;"><a class="btn" id="continuer" href="#">Continuer</a></div>
        </div>

        <div id="pas-achete" class="fiche cache" style="max-width: 560px; margin-top: 24px;">
          <h2>Aucune formation liée à cet e-mail</h2>
          <p>Si tu viens de payer, attends une minute puis recharge la page. Sinon, vérifie que tu t'es connecté avec l'e-mail utilisé pour le paiement.</p>
          <div class="actions"><a class="btn" href="formation.html#inscription">Découvrir la formation</a></div>
        </div>

        <ol class="trente" id="jours" aria-label="Les 30 jours"></ol>
      </div>
    </section>
  </main>

  <script type="module">
    import { supabase, exigerConnexion, echapper, $ } from "./assets/js/supabase.js";
    import { COURSE_SLUG } from "./assets/js/config.js";

    const session = await exigerConnexion();
    if (session) {
      $("#bonjour").textContent = `Connecté avec ${session.user.email}`;
      $("#deconnexion").addEventListener("click", async (e) => {
        e.preventDefault();
        await supabase.auth.signOut();
        location.href = "index.html";
      });

      const [{ data: profil }, { data: cours }, { data: plan }] = await Promise.all([
        supabase.from("profiles").select("is_admin").eq("id", session.user.id).maybeSingle(),
        supabase.from("courses").select("id, title").eq("slug", COURSE_SLUG).maybeSingle(),
        supabase.rpc("course_outline", { p_slug: COURSE_SLUG }),
      ]);
      if (profil?.is_admin) $("#lien-admin").classList.remove("cache");

      if (cours) {
        $("#titre").textContent = cours.title;
        const [{ data: acces }, { data: lisibles }, { data: faits }] = await Promise.all([
          supabase.rpc("has_access", { p_course_id: cours.id }),
          supabase.from("lessons").select("id").eq("course_id", cours.id),
          supabase.from("progress").select("lesson_id").eq("user_id", session.user.id),
        ]);
        const ouvertes = new Set((lisibles || []).map((l) => l.id));
        const termines = new Set((faits || []).map((p) => p.lesson_id));
        const lecons = plan || [];

        if (!acces) $("#pas-achete").classList.remove("cache");
        else {
          const nb = lecons.filter((l) => termines.has(l.lesson_id)).length;
          const pct = lecons.length ? Math.round((nb / lecons.length) * 100) : 0;
          $("#bloc-progression").classList.remove("cache");
          $("#barre").setAttribute("aria-valuenow", pct);
          $("#barre > div").style.width = pct + "%";
          $("#texte-progression").textContent = `${nb} jour${nb > 1 ? "s" : ""} terminé${nb > 1 ? "s" : ""} sur ${lecons.length}`;
          const suivante = lecons.find((l) => !termines.has(l.lesson_id)) || lecons[0];
          if (suivante) {
            $("#continuer").href = `lecon.html?jour=${suivante.position}`;
            $("#continuer").textContent = nb ? `Continuer : jour ${suivante.position}` : "Commencer le jour 1";
          }
        }

        $("#jours").innerHTML = lecons.map((l) => {
          const ouverte = ouvertes.has(l.lesson_id);
          const classe = termines.has(l.lesson_id) ? "fait" : ouverte ? "" : "verrou";
          const titre = echapper(l.title);
          return `<li class="jour ${classe}"><span class="num">Jour ${l.position}</span>
            ${ouverte ? `<a class="titre" href="lecon.html?jour=${l.position}">${titre}</a>` : `<span class="titre">${titre}</span>`}</li>`;
        }).join("");
      }
    }
  </script>
</body>
</html>
